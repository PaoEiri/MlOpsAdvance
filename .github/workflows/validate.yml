name: Validate Model

on:
  workflow_run:
    workflows: ["Train Model"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      accuracy: ${{ steps.metrics.outputs.accuracy }}
      precision: ${{ steps.metrics.outputs.precision }}
      recall: ${{ steps.metrics.outputs.recall }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Download model_id artifact
        uses: actions/download-artifact@v4
        with:
          name: model-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate model
        run: |
          MODEL_ID=$(cat model_id.txt | tr -d ' \n')
          echo "Using model_id: $MODEL_ID"

          uv sync --group dev
          uv pip install -e .
          uv run -m revolutionary_mlops validate "$MODEL_ID" --validate-path data/validate.csv > validate_output.txt

      - name: Extract metrics
        id: metrics
        run: |
          ACC=$(awk -F'=' '/^accuracy=/ {print $2}' validate_output.txt | tr -d '\r')
          PREC=$(awk -F'=' '/^precision=/ {print $2}' validate_output.txt | tr -d '\r')
          REC=$(awk -F'=' '/^recall=/ {print $2}' validate_output.txt | tr -d '\r')

          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "precision=$PREC" >> $GITHUB_OUTPUT
          echo "recall=$REC" >> $GITHUB_OUTPUT

          echo "✅ Extracted metrics:"
          echo "   Accuracy: $ACC"
          echo "   Precision: $PREC"
          echo "   Recall: $REC"

      - name: Quality check
        run: |
          python3 - <<EOF
          import sys
          acc=${{ steps.metrics.outputs.accuracy }}
          prec=${{ steps.metrics.outputs.precision }}
          rec=${{ steps.metrics.outputs.recall }}
          
          print(f"Accuracy: {acc:.2%}")
          print(f"Precision: {prec:.2%}")
          print(f"Recall: {rec:.2%}")
          
          if acc < 0.80 or prec < 0.80 or rec < 0.80:
              print("\n❌ Model quality too low. Failing pipeline.")
              sys.exit(1)
          else:
              print("\n✅ All metrics passed validation!")
          EOF

      - name: Update metrics history
        id: history
        run: |
          python3 - <<'EOF'
          import json
          from datetime import datetime
          from pathlib import Path

          # Crear directorio si no existe
          Path(".github/data").mkdir(parents=True, exist_ok=True)

          # Leer histórico existente
          history_file = Path(".github/data/metrics_history.json")
          if history_file.exists():
              with open(history_file, 'r') as f:
                  history = json.load(f)
          else:
              history = []

          # Crear nuevo registro
          new_record = {
              "run_id": ${{ github.event.workflow_run.id }},
              "run_number": ${{ github.event.workflow_run.run_number }},
              "date": "${{ github.event.workflow_run.created_at }}",
              "accuracy": ${{ steps.metrics.outputs.accuracy }},
              "precision": ${{ steps.metrics.outputs.precision }},
              "recall": ${{ steps.metrics.outputs.recall }},
              "status": "success",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.event.workflow_run.head_branch }}"
          }

          # Agregar al histórico (máximo 100 registros)
          history.insert(0, new_record)
          history = history[:100]

          # Guardar
          with open(history_file, 'w') as f:
              json.dump(history, f, indent=2)

          print(f"✅ History updated. Total records: {len(history)}")
          EOF

      - name: Commit history to repository
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .github/data/metrics_history.json
          git commit -m "chore: update metrics history - run #${{ github.event.workflow_run.run_number }}" || echo "No changes to commit"
          git push || echo "Nothing to push"

  deploy:
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Generate HTML Report with History
        run: |
          mkdir -p report
          python3 .github/scripts/generate_report.py \
            "${{ needs.validate.outputs.accuracy }}" \
            "${{ needs.validate.outputs.precision }}" \
            "${{ needs.validate.outputs.recall }}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "report/index.html"

      - name: Verify report generated
        run: |
          echo "=== Report verification ==="
          if [ -f report/index.html ]; then
            echo "✅ report/index.html created successfully"
            echo "   Size: $(wc -c < report/index.html) bytes"
          else
            echo "❌ report/index.html NOT created"
            exit 1
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Success
        run: |
          echo "=== ✅ Validation & Deployment Successful ==="
          echo ""
          echo "Metrics:"
          echo "  • Accuracy:  ${{ needs.validate.outputs.accuracy }}"
          echo "  • Precision: ${{ needs.validate.outputs.precision }}"
          echo "  • Recall:    ${{ needs.validate.outputs.recall }}"
          echo ""
          echo "Report URL: ${{ steps.deployment.outputs.page_url }}"