name: Tests

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - run: |
          uv sync --group dev
          uv pip install -e .
          uv run pytest tests
