name: Deploy Report

on:
  workflow_run:
    workflows: ["Validate Model"]
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          version: "latest"

      - name: Download validation metrics
        uses: actions/download-artifact@v4
        with:
          name: validation-metrics
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract metrics from artifact
        id: extract
        run: |
          ACC=$(awk -F'=' '/^accuracy=/ {print $2}' validate_output.txt | tr -d '\r')
          PREC=$(awk -F'=' '/^precision=/ {print $2}' validate_output.txt | tr -d '\r')
          REC=$(awk -F'=' '/^recall=/ {print $2}' validate_output.txt | tr -d '\r')

          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "precision=$PREC" >> $GITHUB_OUTPUT
          echo "recall=$REC" >> $GITHUB_OUTPUT

      - name: Generate HTML Report
        run: |
          python3 .github/scripts/generate_report.py \
            "${{ steps.extract.outputs.accuracy }}" \
            "${{ steps.extract.outputs.precision }}" \
            "${{ steps.extract.outputs.recall }}" \
            "${{ github.event.workflow_run.created_at }}"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4