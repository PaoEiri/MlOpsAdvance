name: Deploy Report

on:
  workflow_run:
    workflows: ["Validate Model"]
    types: [completed]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deployReport:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with persist credentials
        uses: actions/checkout@v4
      - run: |
          python -c "
          html=open('templates.html').read().replace("{{code}}", 2)
          open('public/index.html', 'w').write(html)
          " 
      - uses: actions/configure-pages@v5 
      - uses: actions/upload-pages-artifact@v3 
        with:
          path: public 
      - uses: actions/deploy-pages@v3 