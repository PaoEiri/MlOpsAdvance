name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          version: "latest"

      - run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run ty .
