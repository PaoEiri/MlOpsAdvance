name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Format check (excluding .github)
        run: uv run ruff format --check --exclude .github .

      - name: Lint check (excluding .github)
        run: uv run ruff check --exclude .github .
          
