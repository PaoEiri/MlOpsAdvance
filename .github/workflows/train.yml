name: Train Model

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  train:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      model_id: ${{ steps.extract.outputs.model_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          version: "latest"

      - name: Train model
        run: |
          uv sync --group dev
          uv pip install -e .
          uv run -m revolutionary_mlops train --train-path data/train.csv --test-path data/test.csv > train_output.txt

      - name: Extract model_id
        id: extract
        run: |
          MODEL_ID=$(awk -F'=' '/^model_id=/ {print $2}' train_output.txt | tr -d '\r')
          echo "model_id=$MODEL_ID"
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT

      - name: Upload model_id artifact
        uses: actions/upload-artifact@v4
        with:
          name: model_id
          path: train_output.txt