<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Validation Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
        }
        .metric-percentage {
            font-size: 18px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .chart-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        #metricsChart {
            max-height: 400px;
        }
        .history-table {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .history-title {
            padding: 20px 40px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #f5f5f5;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .metric-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        .footer {
            color: #999;
            font-size: 12px;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 768px) {
            .header { padding: 20px; }
            h1 { font-size: 22px; }
            .metrics { grid-template-columns: 1fr; }
            .chart-container { padding: 20px; }
            table {
                font-size: 12px;
            }
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Model Validation Report</h1>
            <p class="subtitle">Latest validation results</p>

            <div id="status"></div>

            <div class="metrics">
                <div class="metric">
                    <div class="metric-label">Accuracy</div>
                    <div class="metric-value" id="accuracy">-</div>
                    <div class="metric-percentage">%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Precision</div>
                    <div class="metric-value" id="precision">-</div>
                    <div class="metric-percentage">%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Recall</div>
                    <div class="metric-value" id="recall">-</div>
                    <div class="metric-percentage">%</div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">📊 Metrics History</div>
            <canvas id="metricsChart"></canvas>
        </div>

        <div class="history-table">
            <div class="history-title">📈 Historical Records (Last 20)</div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Accuracy</th>
                        <th>Precision</th>
                        <th>Recall</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #999;">Loading history...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Generated by GitHub Actions • <span id="timestamp">-</span>
        </div>
    </div>

    <script>
        let chart = null;

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function fillMetrics(accuracy, precision, recall, timestamp) {
            document.getElementById('accuracy').textContent = (accuracy * 100).toFixed(2);
            document.getElementById('precision').textContent = (precision * 100).toFixed(2);
            document.getElementById('recall').textContent = (recall * 100).toFixed(2);
            document.getElementById('timestamp').textContent = formatDate(timestamp);

            const threshold = 0.80;
            const allPass = accuracy >= threshold && precision >= threshold && recall >= threshold;
            const statusDiv = document.getElementById('status');

            if (allPass) {
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ All metrics passed validation (≥80%)';
            } else {
                statusDiv.className = 'status warning';
                statusDiv.innerHTML = '⚠️ Some metrics below threshold (80%)';
            }
        }

        function loadHistory(history) {
            if (!history || history.length === 0) {
                document.getElementById('historyTableBody').innerHTML = 
                    '<tr><td colspan="5" style="text-align: center; color: #999;">No historical data available</td></tr>';
                return;
            }

            // Mostrar tabla
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            
            history.slice(0, 20).forEach(record => {
                const row = document.createElement('tr');
                const acc = (record.accuracy * 100).toFixed(2);
                const prec = (record.precision * 100).toFixed(2);
                const rec = (record.recall * 100).toFixed(2);
                
                const threshold = 0.80;
                const badgeClass = (record.accuracy >= threshold && record.precision >= threshold && record.recall >= threshold) 
                    ? 'badge-success' 
                    : 'badge-warning';
                
                row.innerHTML = `
                    <td>${formatDate(record.date)}</td>
                    <td>${acc}%</td>
                    <td>${prec}%</td>
                    <td>${rec}%</td>
                    <td><span class="metric-badge ${badgeClass}">${record.status}</span></td>
                `;
                tbody.appendChild(row);
            });

            // Crear gráfica
            createChart(history.slice(0, 20).reverse());
        }

        function createChart(history) {
            const ctx = document.getElementById('metricsChart').getContext('2d');
            
            const labels = history.map(r => {
                const date = new Date(r.date);
                return date.toLocaleDateString('es-ES', { month: 'short', day: 'numeric' });
            });
            
            const accuracyData = history.map(r => (r.accuracy * 100).toFixed(2));
            const precisionData = history.map(r => (r.precision * 100).toFixed(2));
            const recallData = history.map(r => (r.recall * 100).toFixed(2));

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Accuracy',
                            data: accuracyData,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        },
                        {
                            label: 'Precision',
                            data: precisionData,
                            borderColor: '#764ba2',
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#764ba2',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        },
                        {
                            label: 'Recall',
                            data: recallData,
                            borderColor: '#f093fb',
                            backgroundColor: 'rgba(240, 147, 251, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#f093fb',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Los valores se inyectarán aquí con un script inline
        });
    </script>
</body>
</html>
