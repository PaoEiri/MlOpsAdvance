<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Validation Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        /* ====== TOKENS ====== */
        :root {
            --azul: #1D3557;
            --azul-claro: #C3CEDB;
            --azul-medio: #9FB3CC;
            --verde: #1D7A52;
            --rojo: #A32D2D;
            --texto: #141413;
            --texto-secundario: #7C7B76;
            --texto-terciario: #ADACA5;
            --fondo: #FFFFFF;
            --fondo-alterno: #F7F7F5;
            --borde: #E5E4E4;
            --tabla-header-bg: #F1EFE8;
            --tabla-divisor: #EEEEE8;

            --font-display: Georgia, Cambria, serif;
            --font-body: "Segoe UI", Calibri, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* ====== BASE ====== */
        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.5;
        }

        h1, h2, h3 {
            font-family: var(--font-display);
            font-weight: 600;
            margin: 0;
        }

        h2 {
            font-size: 24px;
            color: var(--azul);
            margin-bottom: 16px;
        }

        h3 {
            font-size: 18px;
            color: var(--azul);
        }

        /* ====== HEADER ====== */
        .app-header {
            background: var(--azul);
            color: #FFFFFF;
            padding: 32px 24px;
            text-align: center;
        }

        .app-header h1 {
            font-size: clamp(24px, 4vw, 36px);
        }

        .app-header p {
            margin: 8px 0 0;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--azul-claro);
        }

        /* ====== LAYOUT ====== */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        /* ====== CARDS ====== */
        .card {
            background: var(--fondo);
            border-top: 2px solid var(--azul);
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(20, 20, 19, 0.06);
            padding: 24px;
            margin-bottom: 24px;
        }

        /* ====== BANNER DE ESTADO ====== */
        .status-banner {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            margin: 20px auto 0;
        }

        .status-banner.status-ready {
            background: rgba(29, 122, 82, 0.12);
            color: var(--verde);
        }

        .status-banner.status-failed {
            background: rgba(163, 45, 45, 0.12);
            color: var(--rojo);
        }

        /* ====== MÉTRICAS ====== */
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric {
            background: var(--fondo-alterno);
            border-top: 2px solid var(--azul);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--texto-secundario);
            margin-bottom: 8px;
        }

        .metric-value {
            font-family: var(--font-display);
            font-size: 34px;
            font-weight: 600;
            color: var(--azul);
        }

        .metric-percentage {
            font-size: 15px;
            color: var(--texto-secundario);
        }

        /* ====== CHART ====== */
        #metricsChart {
            max-height: 400px;
        }

        /* ====== TABLAS ====== */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        thead th {
            background: var(--tabla-header-bg);
            color: var(--azul);
            font-weight: 700;
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--borde);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--tabla-divisor);
            color: var(--texto);
        }

        tbody tr:nth-child(even) {
            background: var(--fondo-alterno);
        }

        td.empty {
            text-align: center;
            color: var(--texto-secundario);
            padding: 24px;
        }

        /* ====== ESTADO (chips de tabla) ====== */
        .status {
            padding: 3px 9px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            text-transform: capitalize;
        }

        .status-ready {
            background: rgba(29, 122, 82, 0.12);
            color: var(--verde);
        }

        .status-failed {
            background: rgba(163, 45, 45, 0.12);
            color: var(--rojo);
        }

        .status-pending,
        .status-validating {
            background: var(--fondo-alterno);
            color: var(--texto-secundario);
        }

        /* ====== FOOTER ====== */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 13px;
            color: var(--texto-terciario);
            border-top: 1px solid var(--borde);
        }

        @media (max-width: 768px) {
            .card { padding: 16px; }
            .metrics { grid-template-columns: 1fr; }
            table { font-size: 12px; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>Model Validation Report</h1>
        <p>Latest validation results</p>
        <div id="status"></div>
    </header>

    <main>
        <section class="card">
            <h2>Metrics</h2>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-label">Accuracy</div>
                    <div class="metric-value" id="accuracy">-</div>
                    <div class="metric-percentage">%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Precision</div>
                    <div class="metric-value" id="precision">-</div>
                    <div class="metric-percentage">%</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Recall</div>
                    <div class="metric-value" id="recall">-</div>
                    <div class="metric-percentage">%</div>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Metrics History</h2>
            <canvas id="metricsChart"></canvas>
        </section>

        <section class="card">
            <h2>Historical Records (Last 20)</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Accuracy</th>
                            <th>Precision</th>
                            <th>Recall</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td class="empty" colspan="5">Loading history...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        Generated by GitHub Actions &bull; <span id="timestamp">-</span>
    </footer>

    <script>
        let chart = null;

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function fillMetrics(accuracy, precision, recall, timestamp) {
            document.getElementById('accuracy').textContent = (accuracy * 100).toFixed(2);
            document.getElementById('precision').textContent = (precision * 100).toFixed(2);
            document.getElementById('recall').textContent = (recall * 100).toFixed(2);
            document.getElementById('timestamp').textContent = formatDate(timestamp);

            const threshold = 0.80;
            const allPass = accuracy >= threshold && precision >= threshold && recall >= threshold;
            const statusDiv = document.getElementById('status');

            if (allPass) {
                statusDiv.className = 'status-banner status-ready';
                statusDiv.innerHTML = 'All metrics passed validation (&ge;80%)';
            } else {
                statusDiv.className = 'status-banner status-failed';
                statusDiv.innerHTML = 'Some metrics below threshold (80%)';
            }
        }

        function loadHistory(history) {
            if (!history || history.length === 0) {
                document.getElementById('historyTableBody').innerHTML =
                    '<tr><td class="empty" colspan="5">No historical data available</td></tr>';
                return;
            }

            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            history.slice(0, 20).forEach(record => {
                const row = document.createElement('tr');
                const acc = (record.accuracy * 100).toFixed(2);
                const prec = (record.precision * 100).toFixed(2);
                const rec = (record.recall * 100).toFixed(2);

                const threshold = 0.80;
                const statusClass = (record.accuracy >= threshold && record.precision >= threshold && record.recall >= threshold)
                    ? 'status-ready'
                    : 'status-failed';

                row.innerHTML = `
                    <td>${formatDate(record.date)}</td>
                    <td>${acc}%</td>
                    <td>${prec}%</td>
                    <td>${rec}%</td>
                    <td><span class="status ${statusClass}">${record.status}</span></td>
                `;
                tbody.appendChild(row);
            });

            createChart(history.slice(0, 20).reverse());
        }

        function createChart(history) {
            const ctx = document.getElementById('metricsChart').getContext('2d');

            const labels = history.map(r => {
                const date = new Date(r.date);
                return date.toLocaleDateString('es-ES', { month: 'short', day: 'numeric' });
            });

            const accuracyData = history.map(r => (r.accuracy * 100).toFixed(2));
            const precisionData = history.map(r => (r.precision * 100).toFixed(2));
            const recallData = history.map(r => (r.recall * 100).toFixed(2));

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Accuracy',
                            data: accuracyData,
                            borderColor: '#1D3557',
                            backgroundColor: 'rgba(29, 53, 87, 0.10)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#1D3557',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        },
                        {
                            label: 'Precision',
                            data: precisionData,
                            borderColor: '#1D7A52',
                            backgroundColor: 'rgba(29, 122, 82, 0.10)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#1D7A52',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        },
                        {
                            label: 'Recall',
                            data: recallData,
                            borderColor: '#9FB3CC',
                            backgroundColor: 'rgba(159, 179, 204, 0.15)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 4,
                            pointBackgroundColor: '#9FB3CC',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: { size: 12, family: "'Segoe UI', Calibri, Arial, sans-serif" },
                                color: '#141413'
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            grid: { color: '#EEEEE8' },
                            ticks: {
                                color: '#7C7B76',
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#7C7B76' }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Los valores se inyectarán aquí con un script inline
        });
    </script>
</body>
</html>
