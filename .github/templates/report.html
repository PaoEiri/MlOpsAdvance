<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Validation Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
        }
        .metric-percentage {
            font-size: 18px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .footer {
            color: #999;
            font-size: 12px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 22px; }
            .metrics { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Model Validation Report</h1>
        <p class="subtitle">Latest validation results</p>

        <div id="status"></div>

        <div class="metrics">
            <div class="metric">
                <div class="metric-label">Accuracy</div>
                <div class="metric-value" id="accuracy">-</div>
                <div class="metric-percentage">%</div>
            </div>
            <div class="metric">
                <div class="metric-label">Precision</div>
                <div class="metric-value" id="precision">-</div>
                <div class="metric-percentage">%</div>
            </div>
            <div class="metric">
                <div class="metric-label">Recall</div>
                <div class="metric-value" id="recall">-</div>
                <div class="metric-percentage">%</div>
            </div>
        </div>

        <div class="footer">
            Generated by GitHub Actions • <span id="timestamp">-</span>
        </div>
    </div>

    <script>
        // Función para llenar los valores
        function fillMetrics(accuracy, precision, recall, timestamp) {
            document.getElementById('accuracy').textContent = (accuracy * 100).toFixed(2);
            document.getElementById('precision').textContent = (precision * 100).toFixed(2);
            document.getElementById('recall').textContent = (recall * 100).toFixed(2);
            document.getElementById('timestamp').textContent = timestamp;

            // Determinar estado
            const threshold = 0.80;
            const allPass = accuracy >= threshold && precision >= threshold && recall >= threshold;
            const statusDiv = document.getElementById('status');

            if (allPass) {
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '✅ All metrics passed validation (≥80%)';
            } else {
                statusDiv.className = 'status warning';
                statusDiv.innerHTML = '⚠️ Some metrics below threshold (80%)';
            }
        }

        // Esperar a que el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Los valores se inyectarán aquí con un script inline
        });
    </script>
</body>
</html>
